name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter api deploy --prod ./api-deploy

      - name: Vendor the shared package for Oryx's npm install
        run: |
          mkdir -p api-deploy/vendor
          cp -r api-deploy/node_modules/shared api-deploy/vendor/shared
          rm -rf api-deploy/node_modules/shared
          node -e "
            const fs = require('fs');
            const p = 'api-deploy/package.json';
            const pkg = JSON.parse(fs.readFileSync(p));
            pkg.dependencies.shared = 'file:vendor/shared';
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
          "

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_SAND_08CB43A03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "apps/web"
          output_location: "dist"
          api_location: "api-deploy"
          skip_app_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_SAND_08CB43A03 }}
          action: "close"
