name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
        env:
          # Vite inlines import.meta.env.VITE_* into the built JS at build
          # time, not runtime — deploy.yml builds apps/web itself and just
          # uploads the resulting dist/ (skip_app_build: true below), so
          # these have to be present for *this* step or the deployed bundle
          # silently ships with an empty/undefined MSAL config. Repo
          # Variables, not Secrets — none of these are actually secret (no
          # client secret exists for a SPA/public-client registration, and
          # every one of these values is visible in the deployed bundle's own
          # source/network requests regardless). VITE_E2E_BYPASS_AUTH is
          # deliberately not set here — see docs/architecture.md § Open
          # decisions #1 for why that must never reach a real deployed build.
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_AUTHORITY: ${{ vars.VITE_ENTRA_AUTHORITY }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
      - run: pnpm --filter api deploy --prod ./api-deploy

      - name: Vendor the shared package for Oryx's npm install
        run: |
          mkdir -p api-deploy/vendor
          (cd packages/shared && npm pack --silent --pack-destination ../../api-deploy/vendor)
          rm -rf api-deploy/node_modules/shared
          TARBALL=$(basename api-deploy/vendor/*.tgz)
          node -e "
            const fs = require('fs');
            const p = 'api-deploy/package.json';
            const pkg = JSON.parse(fs.readFileSync(p));
            pkg.dependencies.shared = 'file:/github/workspace/api-deploy/vendor/$TARBALL';
            delete pkg.scripts.build;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
          "

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_SAND_08CB43A03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "apps/web/dist"
          api_location: "api-deploy"
          skip_app_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_SAND_08CB43A03 }}
          action: "close"
