<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Abflugtafel · Flugplatz Backnang-Heiningen (EDSH)</title>
<style>
  :root{
    --bg:#070B14; --panel:#0E1626; --panel2:#121C30; --line:#1E2A44;
    --amber:#FBBF24; --ink:#E6EDF7; --muted:#7C8DB0;
    --green:#22C55E; --blue:#3B82F6; --red:#F87171; --grey:#64748B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;padding:18px;display:flex;flex-direction:column;gap:16px}
  .mono{font-family:'Consolas','SF Mono','DejaVu Sans Mono',monospace;font-variant-numeric:tabular-nums}

  .hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:linear-gradient(90deg,#0E1626,#15213a);border:1px solid var(--line);border-radius:14px;padding:14px 20px;flex-wrap:wrap}
  .hdr .l{display:flex;align-items:center;gap:14px}
  .hdr .logo{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);display:grid;place-items:center;font-size:23px}
  .hdr h1{margin:0;font-size:22px;letter-spacing:.5px} .hdr h1 small{color:var(--amber);font-weight:600;font-size:14px;letter-spacing:1px}
  .hdr .place{color:var(--muted);font-size:13px;margin-top:2px}
  .clock{text-align:right}
  .clock .t{font-size:38px;font-weight:700;color:var(--amber);line-height:1}
  .clock .d{color:var(--muted);font-size:13px;margin-top:4px}

  .board{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
  .board .title{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);
    background:#0a1120;font-weight:700;letter-spacing:2px;color:var(--amber);font-size:14px}
  .board .title .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .scroll{overflow:auto}
  .grid{min-width:680px}
  .grow,.ghead{display:grid;grid-template-columns:120px 96px 1fr 130px 168px;align-items:center;gap:10px;padding:13px 18px}
  .ghead{color:var(--muted);font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  .grow{border-bottom:1px solid #15203a;font-size:16px}
  .grow:hover{background:#0d1730}
  .grow.hl{background:rgba(251,191,36,.10);outline:1px solid rgba(251,191,36,.35);outline-offset:-1px}
  .time{color:var(--amber);font-size:19px;font-weight:700}
  .flt{font-weight:700;letter-spacing:1px}
  .ac{color:var(--muted);font-size:14px}
  .stand{color:var(--ink);font-weight:600}
  .st{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:700;letter-spacing:.5px}
  .st .pd{width:8px;height:8px;border-radius:50%}
  .st.completed{background:rgba(100,116,139,.18);color:#94A3B8}.st.completed .pd{background:var(--grey)}
  .st.airborne{background:rgba(59,130,246,.18);color:#93C5FD}.st.airborne .pd{background:var(--blue)}
  .st.ready{background:rgba(34,197,94,.18);color:#86EFAC}.st.ready .pd{background:var(--green);animation:bl 1.1s steps(1) infinite}
  .st.geplant{background:rgba(251,191,36,.16);color:#FCD34D}.st.geplant .pd{background:var(--amber)}
  @keyframes bl{50%{opacity:.25}}
  .sub{padding:9px 18px;color:var(--muted);font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;background:#0a1120;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

  .look{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .look h3{margin:0 0 4px;font-size:16px} .look p{margin:0 0 12px;color:var(--muted);font-size:13px}
  .lookrow{display:flex;gap:10px;max-width:520px}
  .lookrow input{flex:1;background:#0a1120;border:1.6px solid var(--line);border-radius:11px;color:var(--ink);
    padding:13px 14px;font-size:17px;letter-spacing:1px;min-height:50px}
  .lookrow input:focus{outline:none;border-color:var(--amber)}
  .lookrow button{border:0;border-radius:11px;background:var(--amber);color:#1a1300;font-weight:800;padding:0 22px;font-size:15px;cursor:pointer;min-height:50px}
  .result{margin-top:14px;border-radius:12px;padding:16px 18px;display:none}
  .result.show{display:block}
  .result.go{background:linear-gradient(90deg,rgba(34,197,94,.16),rgba(34,197,94,.05));border:1px solid rgba(34,197,94,.4)}
  .result.wait{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.35)}
  .result.info{background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.35)}
  .result.bad{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.4)}
  .result .big{font-size:21px;font-weight:800;margin-bottom:8px}
  .result .kv{display:flex;gap:26px;flex-wrap:wrap;margin-top:10px}
  .result .kv div .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .result .kv div .v{font-size:20px;font-weight:700;color:var(--amber)}
  .result .v.white{color:var(--ink)}
  .hintbar{color:var(--muted);font-size:12px;margin-top:10px;text-align:center}

  @media(max-width:640px){ .clock .t{font-size:28px} .hdr h1{font-size:18px} }
  /* Tafel ist immer dunkel – Dark-OS-Override bestätigt die Farben */
  @media (prefers-color-scheme: dark){ :root{ --bg:#070B14; --panel:#0E1626; --ink:#E6EDF7; } }
</style>
</head>
<body>
  <div class="hdr">
    <div class="l"><div class="logo">✈</div>
      <div><h1>ABFLÜGE <small>DEPARTURES</small></h1><div class="place" id="place">Flugplatz Backnang-Heiningen · EDSH</div></div>
    </div>
    <div class="clock"><div class="t mono" id="clock">--:--:--</div><div class="d" id="cdate">—</div></div>
  </div>

  <div class="board">
    <div class="title"><span class="pulse"></span> RUNDFLÜGE · LIVE-STATUS</div>
    <div class="scroll"><div class="grid">
      <div class="ghead"><div>Zeit</div><div>Flug</div><div>Flugzeug</div><div>Stand</div><div>Status</div></div>
      <div id="rows"></div>
    </div></div>
  </div>

  <div class="look">
    <h3>🎫 Wann bin ich an der Reihe?</h3>
    <p>Geben Sie Ihre Fluggast-ID ein (von Ihrer Bestätigung, z. B. <b>G-042</b>).</p>
    <div class="lookrow"><input id="pid" placeholder="G-___" autocomplete="off"><button data-act="look">Anzeigen</button></div>
    <div class="result" id="result"></div>
    <div class="hintbar" id="refnote">Aktualisiert automatisch · zuletzt: —</div>
  </div>

<script>
(function(){
"use strict";
var KEY='skydispatch_v5', _gs=0;
function seed(){
  _gs=0;
  var firsts=['Anna','Tom','Lina','Eva','Otto','Mia','Max','Jan','Nina','Paul','Lea','Finn','Emma','Ben','Lara','Noah','Sara','Leon','Marie','Luca','Hannah','Felix','Clara','Jonas','Lena','Tim','Julia','Niklas','Laura','David','Sophie','Erik','Maja','Phil','Ida','Jakob','Nora','Moritz','Lilly','Elias','Pia','Henry','Frieda','Theo','Greta','Oskar','Mara','Linus','Romy','Karl'];
  var lasts=['Weber','Lang','Klein','Groß','Stern','Roth','Falk','Berg','Wolf','Hahn','Kern','Vogel','Busch','Frank','Arnold','Böhm','Kraus','Sommer','Winter','Förster','Bauer','Huber','Maier','Hoffmann','Fuchs','Krüger','Richter','Neumann','Schwarz','Zimmer','Brand','Engel','Horn','Jung','Keller','Lorenz','Peters','Reuter','Sauer','Thiel','Voigt','Walter','Adler','Bach','Dorn','Ernst','Götz','Hartmann','Kühn','Mayer'];
  var rs=20260625; function rnd(){ rs=(rs*1103515245+12345)&0x7fffffff; return rs/0x7fffffff; }
  function pick(a){ return a[Math.floor(rnd()*a.length)]; }
  var groups={}, palette=['#2563EB','#7C3AED','#0891B2','#DB2777','#CA8A04','#15803D','#B91C1C','#0D9488','#9333EA','#C2410C','#4F46E5','#0369A1'];
  function gcolor(n){ if(!groups[n]) groups[n]=palette[Object.keys(groups).length%palette.length]; }
  var guests=[];
  function add(name,grp){ _gs++; var paid=rnd()>0.14; var weight=rnd()>0.12?Math.round(48+rnd()*58):null;
    guests.push({id:'g'+_gs,code:'G-'+String(_gs).padStart(3,'0'),name:name,weight:weight,paid:paid,group:grp,checkedIn:false,noShow:false,flown:false}); return guests[guests.length-1]; }
  while(guests.length<150){ var rem=150-guests.length;
    if(rnd()<0.5 && rem>=2){ var ln=pick(lasts),gname=ln,k=2; while(groups[gname]){ gname=ln+' '+k; k++; } gcolor(gname);
      var size=Math.min(rem,2+Math.floor(rnd()*4)); for(var i=0;i<size;i++) add(pick(firsts)+' '+ln,gname);
    } else { add(pick(firsts)+' '+pick(lasts),null); } }
  var pilots=[{id:'p1',name:'Meier',lic:'PPL, Nacht',avail:true},{id:'p2',name:'Schmidt',lic:'PPL',avail:true},{id:'p3',name:'Becker',lic:'CPL',avail:true},{id:'p4',name:'Wagner',lic:'PPL',avail:false}];
  var acs=[{id:'a1',reg:'D-EABC',type:'Cessna 172',seats:4,payload:340,cost:180,img:null},{id:'a2',reg:'D-EXYZ',type:'Piper PA-28',seats:4,payload:340,cost:160,img:null},{id:'a3',reg:'D-EKLM',type:'Cirrus SR22',seats:4,payload:360,cost:240,img:null}];
  var used={};
  function build(payload){ var picked=[],sum=0;
    for(var i=0;i<guests.length && picked.length<4;i++){ var go=guests[i]; if(used[go.id]) continue;
      var w=go.weight==null?Math.round(60+rnd()*28):go.weight; if(sum+w>payload) continue;
      go.paid=true; go.weight=w; used[go.id]=true; picked.push(go); sum+=w; } return picked; }
  var flights=[],fno=0;
  function tISO(h,m){ var d=new Date(); d.setHours(h,m,0,0); return d.toISOString(); }
  function mk(ai,pi,gs,status,off,on){ fno++;
    flights.push({id:'fl'+fno,code:'FL-'+String(fno).padStart(3,'0'),aircraftId:acs[ai].id,pilotId:pilots[pi]?pilots[pi].id:null,guests:gs.map(function(g){return g.id;}),status:status,offBlock:off||null,onBlock:on||null});
    if(status==='completed'){ gs.forEach(function(g){g.checkedIn=true;g.flown=true;}); }
    else if(status==='airborne'||status==='ready'){ gs.forEach(function(g){g.checkedIn=true;}); } }
  mk(0,0,build(340),'completed',tISO(9,2),tISO(9,21)); mk(1,1,build(340),'completed',tISO(9,28),tISO(9,47));
  mk(2,2,build(360),'completed',tISO(9,55),tISO(10,16)); mk(0,0,build(340),'completed',tISO(10,24),tISO(10,43));
  mk(1,1,build(340),'completed',tISO(10,52),tISO(11,11)); mk(2,2,build(360),'completed',tISO(11,20),tISO(11,40));
  mk(0,0,build(340),'completed',tISO(11,48),tISO(12,7)); mk(1,1,build(340),'airborne',new Date(Date.now()-13*60000).toISOString(),null);
  mk(2,2,build(360),'ready',null,null); mk(0,0,build(340),'geplant',null,null); mk(1,2,build(340),'geplant',null,null);
  return { airfield:{name:'Flugplatz Backnang-Heiningen',icao:'EDSH',rwy:'10/28',freq:'123.71',elev:'294 m',operator:'LSV Backnang-Heiningen e. V.'},
    day:{date:'25.06.2026',status:'Aktiv',price:80}, pilots:pilots, aircraft:acs, groups:groups, guests:guests, flights:flights, seq:{g:guests.length,f:fno} };
}
function loadStore(){ try{ var r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} var s=seed(); try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(e){} return s; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function byId(id){ return document.getElementById(id); }
function hhmm(d){ var x=new Date(d); return ('0'+x.getHours()).slice(-2)+':'+('0'+x.getMinutes()).slice(-2); }
function pad3(n){ return 'G-'+String(n).padStart(3,'0'); }
var WD=['So','Mo','Di','Mi','Do','Fr','Sa'], MO=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

var STATUS={completed:'GELANDET',airborne:'IN DER LUFT',ready:'BOARDING',geplant:'GEPLANT'};
function standOf(f,acs){ var m={a1:'Stand 1',a2:'Stand 2',a3:'Stand 3'}; return m[f.aircraftId]||'Stand 1'; }

/* compute estimated departure times for pending flights */
function schedule(S){
  var now=Date.now();
  var pending=S.flights.filter(function(f){return f.status==='ready'||f.status==='geplant';})
    .sort(function(a,b){ var o={ready:0,geplant:1}; if(o[a.status]!==o[b.status]) return o[a.status]-o[b.status]; return a.code<b.code?-1:1; });
  var cur=Math.ceil(now/60000)*60000 + 3*60000; // erste in ~3 min
  var est={};
  pending.forEach(function(f){ est[f.id]=cur; cur+=16*60000; });
  return est;
}

var lookCode='';

function render(){
  var S=loadStore();
  byId('place').textContent=S.airfield.name+' · '+S.airfield.icao;
  var acs=S.aircraft, est=schedule(S);
  var order={airborne:0,ready:1,geplant:2,completed:3};
  var flights=S.flights.slice().sort(function(a,b){
    if(order[a.status]!==order[b.status]) return order[a.status]-order[b.status];
    if(a.status==='completed') return (new Date(b.onBlock||0))-(new Date(a.onBlock||0));
    if(a.status==='ready'||a.status==='geplant') return (est[a.id]||0)-(est[b.id]||0);
    return a.code<b.code?-1:1;
  });
  // Anzeige-Limits: alle airborne + alle ready (boarding), nur naechste 2 geplant, nur letzte 2 gelandet
  var compShown=0, planShown=0, html='', inserted=false;
  flights.forEach(function(f){
    if(f.status==='geplant'){ planShown++; if(planShown>2) return; }
    if(f.status==='completed'){ compShown++; if(compShown>2) return;
      if(!inserted){ html+='<div class="sub">Zuletzt gelandet</div>'; inserted=true; } }
    var ac=S.aircraft.filter(function(a){return a.id===f.aircraftId;})[0]||{reg:'—',type:''};
    var time = f.status==='completed' ? hhmm(f.onBlock)
             : f.status==='airborne' ? hhmm(f.offBlock)
             : (est[f.id]?hhmm(est[f.id]):'—');
    var hl = lookCode && f.guests.indexOf( (S.guests.filter(function(g){return g.code===lookCode;})[0]||{}).id )>=0 ? ' hl':'';
    html+='<div class="grow'+hl+'">'
      +'<div class="time mono">'+time+'</div>'
      +'<div class="flt mono">'+esc(f.code)+'</div>'
      +'<div><span class="mono" style="color:var(--ink)">'+esc(ac.reg)+'</span> <span class="ac">'+esc(ac.type)+'</span></div>'
      +'<div class="stand">'+standOf(f,acs)+'</div>'
      +'<div><span class="st '+f.status+'"><span class="pd"></span>'+STATUS[f.status]+'</span></div>'
    +'</div>';
  });
  byId('rows').innerHTML=html || '<div class="grow"><div></div><div></div><div class="ac">Keine Flüge</div><div></div><div></div></div>';
  renderLookup(S,est,acs);
  byId('refnote').textContent='Aktualisiert automatisch · zuletzt '+hhmm(new Date());
}

function renderLookup(S,est,acs){
  var box=byId('result');
  if(!lookCode){ box.className='result'; box.innerHTML=''; return; }
  var g=S.guests.filter(function(x){return x.code===lookCode;})[0];
  if(!g){ box.className='result bad show'; box.innerHTML='<div class="big">❌ ID '+esc(lookCode)+' nicht gefunden</div>Bitte prüfen Sie Ihre Bestätigung oder melden Sie sich am Check-in.'; return; }
  if(g.flown){ box.className='result info show'; box.innerHTML='<div class="big">✅ '+esc(g.name)+' – Ihr Rundflug ist abgeschlossen.</div>Wir hoffen, es hat Ihnen gefallen!'; return; }
  var f=S.flights.filter(function(fl){return fl.status!=='completed' && fl.guests.indexOf(g.id)>=0;})[0];
  if(!f){
    var needs=[]; if(!g.paid) needs.push('Zahlung offen'); if(g.weight==null) needs.push('noch nicht gewogen');
    box.className='result wait show';
    box.innerHTML='<div class="big">🕓 '+esc(g.name)+' – noch keinem Flug zugewiesen</div>'
      +'Bitte am <b>Check-in</b> melden'+(g.weight==null?' und <b>wiegen</b> lassen':'')+'. Sobald Sie eingeteilt sind, erscheint hier Ihre Startzeit.'
      +(needs.length?'<div class="hintbar" style="text-align:left;margin-top:8px;color:var(--amber)">Status: '+esc(needs.join(' · '))+'</div>':'');
    return;
  }
  var stand=standOf(f,acs);
  if(f.status==='airborne'){ box.className='result info show'; box.innerHTML='<div class="big">🛫 '+esc(g.name)+' – Ihr Flug '+esc(f.code)+' ist in der Luft.</div>Startzeit war '+hhmm(f.offBlock)+'.'; return; }
  if(f.status==='ready'){ box.className='result go show';
    box.innerHTML='<div class="big">🟢 JETZT BOARDING – '+esc(g.name)+'</div>Bitte begeben Sie sich <b>sofort</b> zu Ihrem Abflugstand.'
      +'<div class="kv"><div><div class="k">Flug</div><div class="v">'+esc(f.code)+'</div></div>'
      +'<div><div class="k">Abflugstand</div><div class="v">'+esc(stand)+'</div></div>'
      +'<div><div class="k">Status</div><div class="v">Boarding</div></div></div>'; return;
  }
  // geplant
  var e=est[f.id]; var board=new Date(e-15*60000);
  box.className='result wait show';
  box.innerHTML='<div class="big">🎫 '+esc(g.name)+' – Ihr Flug ist eingeplant</div>'
    +'<div class="kv">'
    +'<div><div class="k">Flug</div><div class="v">'+esc(f.code)+'</div></div>'
    +'<div><div class="k">Voraussichtl. Start</div><div class="v">'+(e?hhmm(e):'—')+'</div></div>'
    +'<div><div class="k">Abflugstand</div><div class="v">'+esc(stand)+'</div></div>'
    +'<div><div class="k">Bitte am Stand bis</div><div class="v white">'+(e?hhmm(board):'—')+'</div></div>'
    +'</div><div class="hintbar" style="text-align:left;margin-top:10px">Bitte spätestens 15 Minuten vor dem Start am Abflugstand einfinden. Zeiten können sich kurzfristig ändern.</div>';
}

function tick(){
  var n=new Date();
  byId('clock').textContent=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2)+':'+('0'+n.getSeconds()).slice(-2);
  byId('cdate').textContent=WD[n.getDay()]+', '+n.getDate()+'. '+MO[n.getMonth()]+' '+n.getFullYear();
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  if(el.getAttribute('data-act')==='look'){ doLook(); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Enter' && document.activeElement && document.activeElement.id==='pid') doLook(); });
function doLook(){
  var v=byId('pid').value.trim().toUpperCase().replace(/\s/g,'');
  if(/^\d+$/.test(v)) v=pad3(parseInt(v,10));
  else if(/^G\d+$/.test(v)) v='G-'+v.slice(1).padStart(3,'0');
  lookCode=v; render();
}

tick(); render();
setInterval(tick,1000);
setInterval(render,15000);
})();
</script>
</body>
</html>
